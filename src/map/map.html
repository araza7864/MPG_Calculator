<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MPG Trip Map</title>
     <link 
     rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""
     />

     <script 
     src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin="">
    </script>
</head>
<body>
    <div id="map" style="height: 100vh;"></div>
    <script>
        var map = L.map('map').setView([51.505, -0.09], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        fetch('./route.json')
            .then(response=> {
                if (!response.ok) {
                    throw new Error("route.json not found or failed to load");
                }
                return response.json();
            })
            .then(data => {
                const routeLayer = L.geoJSON(data.geojson).addTo(map);
                map.fitBounds(routeLayer.getBounds(), {padding: [20, 20]});
                console.log("Loaded route", data.origin, "→", data.destination);
            })
            .catch(error => {
                console.error(err);
                alert("Could not load route.json. Make sure map/route.json exists and you opened via http.server.");
            });
    </script>
</body>
</html>
